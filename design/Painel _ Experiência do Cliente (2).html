<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel | Experiência do Cliente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F3F3;--ink:#171717;--body:#323232;--mut:#666;--forest:#075618;--em:#02A562;--emh:#23823D;--or:#F29222;--red:#CA2E24;--bd:#E9E9E9;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--body);font:400 15px/1.5 Lato,Helvetica,Arial,sans-serif}
a{color:var(--forest);font-weight:700}
:focus-visible{outline:3px solid var(--em);outline-offset:2px}
.app{display:grid;grid-template-columns:auto 1fr;min-height:100dvh}
aside{background:#fff;border:1px solid var(--bd);border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,.08);margin:16px 0 16px 16px;padding:20px 12px 12px;display:flex;flex-direction:column;gap:28px;position:sticky;top:16px;height:calc(100dvh - 32px);align-self:start;width:248px;transition:width .25s cubic-bezier(.3,.7,.2,1)}
.col aside{width:72px}
.brand{display:flex;align-items:center}
.lg{display:block;height:48px;width:138px;overflow:hidden;transition:width .25s cubic-bezier(.3,.7,.2,1)}
.lg svg{display:block;height:48px;width:auto}
.col .lg{width:48px}
nav{display:flex;flex-direction:column;gap:4px;flex:1}
.sp{flex:1}
nav a,.tg{position:relative;display:flex;align-items:center;gap:14px;width:100%;height:48px;padding:0 13px;border-radius:12px;color:var(--body);text-decoration:none;font:700 15px/1 Lato,sans-serif;background:none;border:0;cursor:pointer;transition:background-color .15s ease-in-out}
nav a:hover,.tg:hover{background:var(--bg)}
nav a.on,nav a.on:hover{background:#255521;color:#fff}
nav a.on svg{color:#93CBA0}
nav svg,.tg svg{flex:none;width:22px;height:22px}
.lb{white-space:nowrap;overflow:hidden;max-width:170px;transition:max-width .25s,opacity .2s}
.col .lb{max-width:0;opacity:0}
nav em{margin-left:auto;font-style:normal;font-size:12px;font-weight:900;background:var(--red);color:#fff;border-radius:99px;padding:2px 8px}
.col nav em{position:absolute;top:8px;right:8px;width:10px;height:10px;padding:0;font-size:0;border:2px solid #fff;box-sizing:content-box}
.tg svg{transition:transform .25s}
.bt{display:flex;flex-direction:column;gap:8px}
.me{display:flex;align-items:center;gap:10px;height:48px;padding:6px;background:var(--bg);border-radius:99px}
.col .me{gap:0}
.av{display:grid;place-items:center;flex:none;width:36px;height:36px;border-radius:50%;background:var(--forest);color:#fff;font-size:13px;font-weight:900}
.me strong{display:block;font-size:14px;color:var(--ink);line-height:1.2}
.me small{display:block;font-size:12px;color:var(--mut);line-height:1.2}
.col .tg svg{transform:rotate(180deg)}
.col nav a:hover::after,.col nav a:focus-visible::after,.col .tg:hover::after,.col .tg:focus-visible::after{content:attr(data-tip);position:absolute;left:calc(100% + 14px);top:50%;transform:translateY(-50%);background:#171717;color:#fff;font-size:13px;padding:6px 10px;border-radius:8px;white-space:nowrap;z-index:30;pointer-events:none}
main{padding:32px clamp(16px,4vw,40px) 56px;max-width:1200px;width:100%}
h1{font:900 clamp(1.75rem,3vw,2.25rem)/1.1 Lato,sans-serif;color:var(--forest);letter-spacing:-.02em;margin:0}
h2{font:700 1.1rem/1.2 Lato,sans-serif;color:var(--ink);margin:0 0 14px}
.sub{color:var(--mut);margin:6px 0 28px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;box-shadow:-10px 15px 30px rgba(0,0,0,.04);padding:20px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:16px}
.kpi b{display:block;font:900 2.5rem/1 Lato,sans-serif;color:var(--forest);margin:8px 0 4px}
.kpi small{color:var(--mut)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.g3{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}
.stack{display:grid;gap:16px}
.bar{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:12px;margin:12px 0}
.bar.n{grid-template-columns:28px 1fr 44px}
.trk{height:10px;background:#EEE;border-radius:5px;overflow:hidden}
.trk i{display:block;height:100%;border-radius:5px}
.bar span:last-child{text-align:right;font-weight:700}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:10px 12px;white-space:nowrap}
td{padding:14px 12px;border-top:1px solid #EEE;vertical-align:middle}
tbody tr:hover td{background:#FAFAFA}
td.tx{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-weight:900;font-size:14px}
.nt.big{width:64px;height:64px;font-size:30px}
.bd{display:inline-block;padding:3px 10px;border:1px solid;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.s-nova{background:#ECFDF5;color:var(--forest);border-color:#A7F3D0}
.s-nao{background:#FFFBEB;color:#92400E;border-color:#FDE68A}
.s-trat{background:#F0F9FF;color:#075985;border-color:#BAE6FD}
.s-esc{background:#FFF1F2;color:var(--red);border-color:#FDA4AF;font-weight:900;animation:pu 1.6s ease-in-out infinite}
.s-resp{background:#F0FDFA;color:#115E59;border-color:#99F6E4}
.s-conc{background:#255521;color:#fff;border-color:#255521}
@keyframes pu{50%{opacity:.55}}
.fl{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:1.5px solid #E3E3E3;border-radius:8px;padding:0 12px;height:44px}
textarea{width:100%;height:auto;min-height:110px;padding:12px;resize:vertical}
input::placeholder,textarea::placeholder{color:#999}
.btn{font:700 .875rem Lato,sans-serif;text-transform:uppercase;letter-spacing:.02em;border:0;border-radius:8px;min-height:48px;padding:12px 24px;cursor:pointer;color:#fff;background:var(--em);box-shadow:0 1px 2px rgba(0,0,0,.08);transition:background-color .15s ease-in-out}
.btn:hover{background:var(--emh)}
.btn.f{background:var(--forest)}
.btn.f:hover{background:var(--or)}
.btn.o{background:#fff;color:var(--em);border:1px solid var(--em);border-radius:99px;box-shadow:none}
.btn.o:hover{background:var(--em);color:#fff}
.btn.s{min-height:36px;padding:6px 16px;font-size:.75rem}
.acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tl{list-style:none;margin:0 0 0 6px;padding:0;border-left:2px solid #E3E3E3}
.tl li{position:relative;padding:0 0 18px 20px}
.tl li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--em);border:2px solid #fff}
.tl small{color:var(--mut);display:block}
.back{display:inline-block;margin-bottom:16px;text-decoration:none}
.k{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.foot{color:var(--mut);font-size:13px;margin-top:20px}
@media (max-width:860px){
.app{display:block}
aside,.col aside{position:fixed;left:12px;right:12px;top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:auto;height:auto;margin:0;padding:6px;flex-direction:row;gap:0;z-index:20}
.brand,.bt,.sp{display:none}
nav{flex-direction:row;gap:2px}
nav a{justify-content:center;padding:0;height:52px;gap:0}
.lb{max-width:0;opacity:0}
nav em{position:absolute;top:10px;right:calc(50% - 20px);width:10px;height:10px;padding:0;font-size:0;border:2px solid #fff;box-sizing:content-box}
nav a::after{display:none!important}
main{padding-bottom:112px}
.g2,.g3{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  <nav id="nav" aria-label="Principal"></nav>
  <div class="bt"><button class="tg" id="tg" type="button" aria-expanded="true" aria-label="Recolher menu" data-tip="Recolher menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg><span class="lb">Recolher menu</span></button>
  <div class="me" title="Ana Souza, Administrador"><span class="av">AS</span><div class="lb"><strong>Ana Souza</strong><small>Administrador</small></div></div></div>
</aside>
<main id="main"></main>
</div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const U=["Centro","Shopping","Cohama","Renascença","Turu"];
const NC={1:"#CA2E24",2:"#E65100",3:"#F29222",4:"#93CBA0",5:"#02A562"},W={1:"Ruim",2:"Abaixo do esperado",3:"Regular",4:"Muito bom",5:"Excelente"};
const ST={nova:"Nova",nao:"Não respondida",trat:"Em tratamento",esc:"Escalonada",resp:"Respondida",conc:"Concluída"};
const ID=["3f2a9c1e-7b4d-4e8a-9a51-2c6d8e0f1a47","b81d5e07-2a3c-4f69-8d14-9e7a6c3b5f02","c4e1a7b3-5d92-4a06-b7f8-1e3c9d2a6b58","d90b3f62-8c17-4d5e-a2b4-6f1e0c7a9d83","e57a2c84-1b6f-4938-8d0a-3b9c5e1f7a26"];
// Dados fictícios de demonstração: [protocolo, horas atrás, unidade, nota, comentário, senha, status]
const D=[[1042,3,0,5,"Atendimento rápido e equipe muito atenciosa.","A045","nova"],[1041,6,1,1,"Esperei mais de uma hora e ninguém explicou o motivo da demora.","B112","nova"],[1040,20,2,2,"O resultado atrasou e não consegui falar com ninguém por telefone.","C078","trat"],[1039,30,0,4,"Tudo certo, só o estacionamento estava lotado.","","resp"],[1038,40,3,1,"Fui atendido de forma grosseira na recepção.","D203","esc"],[1037,60,4,3,"Atendimento regular, a espera foi longa.","E019","nao"],[1036,75,1,5,"Coleta sem dor e com muita educação.","B090","conc"],[1035,96,2,2,"Cobraram um exame que não fiz.","C051","trat"],[1034,120,0,5,"Excelente, voltarei sempre.","","conc"],[1033,130,3,4,"Bom atendimento, ambiente limpo.","D180","resp"],[1032,150,4,1,"Perdi minha vez na fila e não resolveram.","E002","esc"],[1031,170,1,3,"","B044","nao"]]
.map(([id,h,u,n,t,s,st])=>{const x={id,h,u,n,t,s,st,hist:[{h,w:"Cliente",x:"Resposta recebida pelo link da pesquisa."}]};
if(st!="nova"&&st!="nao")x.hist.push({h:h-1,w:"Unidade "+U[u],x:"Tratativa iniciada."});
if(st=="esc")x.hist.push({h:Math.max(h-2,0),w:"Sistema",x:"Escalonada para a gerência."});
if(st=="resp"||st=="conc")x.hist.push({h:Math.max(h-3,0),w:"Unidade "+U[u],x:"Resposta enviada ao cliente."});
if(st=="conc")x.hist.push({h:Math.max(h-4,0),w:"Unidade "+U[u],x:"Manifestação concluída."});
return x});
const open=i=>["nova","nao","trat","esc"].includes(i.st),late=i=>open(i)&&i.h>48;
const ago=h=>h<1?"agora":h<24?Math.round(h)+" h":Math.floor(h/24)+" d";
const ic=p=>`<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const NAV=[["dashboard","Dashboard",'<path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"/>'],["pesquisas","Pesquisas",'<path d="M9 4h6v3H9zM7 5H5v16h14V5h-2M9 12h6M9 16h4"/>'],["manifestacoes","Manifestações",'<path d="M4 5h16v11H9l-5 4z"/>'],["pendencias","Pendências",'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],["unidades","Unidades",'<path d="M12 21s7-6 7-11a7 7 0 10-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>'],["usuarios","Usuários",'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'],["relatorios","Relatórios",'<path d="M4 20V4M4 20h16M8 16v-5M13 16V8M18 16v-3"/>']];
const OR=["dashboard","pesquisas","manifestacoes","pendencias","relatorios","unidades","usuarios"];NAV.sort((a,b)=>OR.indexOf(a[0])-OR.indexOf(b[0]));
const bd=s=>`<span class="bd s-${s}">${ST[s]}</span>`;
const nt=n=>`<span class="nt" style="background:${NC[n]};color:${n==3||n==4?"#171717":"#fff"}">${n}</span>`;
const head=(t,s)=>`<h1>${t}</h1><p class="sub">${s}</p>`;
const THEAD="<thead><tr><th>Protocolo</th><th>Unidade</th><th>Nota</th><th>Comentário</th><th>Senha</th><th>Status</th><th>Há</th></tr></thead>";
const rows=l=>l.map(i=>`<tr><td><a href="#manifestacao-${i.id}">#${i.id}</a></td><td>${U[i.u]}</td><td>${nt(i.n)}</td><td class="tx">${esc(i.t||"Sem comentário")}</td><td>${i.s||"-"}</td><td>${bd(i.st)}</td><td>${ago(i.h)}</td></tr>`).join("");
const none='<tr><td colspan="7">Nenhuma manifestação encontrada.</td></tr>';
const tbl=l=>`<div class="card wrap"><table>${THEAD}<tbody id="tb">${rows(l)||none}</tbody></table></div>`;

function dash(){
const n=D.length,avg=D.reduce((a,i)=>a+i.n,0)/n,sat=Math.round(D.filter(i=>i.n>=4).length/n*100);
const dist=[5,4,3,2,1].map(k=>{const c=D.filter(i=>i.n==k).length;return `<div class="bar n"><span>${nt(k)}</span><div class="trk"><i style="width:${c/n*100}%;background:${NC[k]}"></i></div><span>${c}</span></div>`}).join("");
const byU=U.map((u,k)=>{const l=D.filter(i=>i.u==k);if(!l.length)return"";const a=l.reduce((s,i)=>s+i.n,0)/l.length;return `<div class="bar"><span>${u}</span><div class="trk"><i style="width:${a/5*100}%;background:var(--em)"></i></div><span>${a.toFixed(1)}</span></div>`}).join("");
return head("Dashboard","Visão geral das respostas das pesquisas de todas as unidades.")+
`<div class="kpis"><div class="card kpi"><span class="k">Respostas</span><b>${n}</b><small>no período</small></div>
<div class="card kpi"><span class="k">Nota média</span><b>${avg.toFixed(1)}</b><small>de 5</small></div>
<div class="card kpi"><span class="k">Satisfeitos</span><b>${sat}%</b><small>notas 4 e 5</small></div>
<div class="card kpi"><span class="k">Pendências</span><b>${D.filter(open).length}</b><small>${D.filter(late).length} atrasadas</small></div></div>
<div class="g2"><div class="card"><h2>Distribuição das notas</h2>${dist}</div><div class="card"><h2>Nota média por unidade</h2>${byU}</div></div>
<div class="hd" style="margin:24px 0 12px"><h2 style="margin:0">Manifestações recentes</h2><a href="#manifestacoes">Ver todas</a></div>${tbl(D.slice(0,5))}
<p class="foot">Protótipo com dados fictícios.</p>`}

function pesq(){return head("Pesquisas","Cada unidade tem um link único, usado no QR Code afixado no local.")+
`<div class="card wrap"><table><thead><tr><th>Pesquisa</th><th>Unidade</th><th>Link</th><th>Respostas</th><th></th></tr></thead><tbody>${U.map((u,k)=>`<tr><td><a href="#pesquisa-${ID[k]}">Satisfação no atendimento</a></td><td>${u}</td><td>/pesquisa/${ID[k].slice(0,8)}…</td><td>${D.filter(i=>i.u==k).length}</td><td><button class="btn o s" data-copy="${k}">Copiar link</button></td></tr>`).join("")}</tbody></table></div>`}

function manif(){return head("Manifestações","Todas as respostas recebidas. Filtre por unidade, nota ou status.")+
`<div class="fl"><input id="q" type="search" placeholder="Buscar por protocolo, senha ou texto" aria-label="Buscar" style="flex:1;min-width:220px">
<select id="fs" aria-label="Status"><option value="">Todos os status</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select>
<select id="fu" aria-label="Unidade"><option value="">Todas as unidades</option>${U.map((u,k)=>`<option value="${k}">${u}</option>`).join("")}</select>
<select id="fn" aria-label="Nota"><option value="">Todas as notas</option>${[5,4,3,2,1].map(k=>`<option value="${k}">Nota ${k}</option>`).join("")}</select></div>
${tbl(D)}<p class="foot" id="ct"></p>`}
function fill(){const q=$("#q").value.toLowerCase(),fs=$("#fs").value,fu=$("#fu").value,fn=$("#fn").value;
const l=D.filter(i=>(!q||(i.id+" "+i.s+" "+i.t).toLowerCase().includes(q))&&(!fs||i.st==fs)&&(fu===""||i.u==fu)&&(!fn||i.n==fn));
$("#tb").innerHTML=rows(l)||none;$("#ct").textContent=l.length+" de "+D.length+" manifestações";}

function pdet(id){const k=ID.indexOf(id);if(k<0)return head("Pesquisa não encontrada",'<a href="#pesquisas">Voltar para a lista</a>');
const l=D.filter(i=>i.u==k),n=l.length,avg=n?l.reduce((a,i)=>a+i.n,0)/n:0,sat=n?Math.round(l.filter(i=>i.n>=4).length/n*100):0;
const dist=[5,4,3,2,1].map(v=>{const c=l.filter(i=>i.n==v).length;return `<div class="bar n"><span>${nt(v)}</span><div class="trk"><i style="width:${n?c/n*100:0}%;background:${NC[v]}"></i></div><span>${c}</span></div>`}).join("");
return `<a class="back" href="#pesquisas">← Voltar para a lista</a>
<div class="hd"><div><h1>Satisfação no atendimento</h1><p class="sub">Unidade ${U[k]}</p></div><button class="btn o s" data-copy="${k}">Copiar link</button></div>
<div class="kpis"><div class="card kpi"><span class="k">Respostas</span><b>${n}</b><small>nesta pesquisa</small></div>
<div class="card kpi"><span class="k">Nota média</span><b>${n?avg.toFixed(1):"-"}</b><small>de 5</small></div>
<div class="card kpi"><span class="k">Satisfeitos</span><b>${sat}%</b><small>notas 4 e 5</small></div>
<div class="card kpi"><span class="k">Pendências</span><b>${l.filter(open).length}</b><small>${l.filter(late).length} atrasadas</small></div></div>
<div class="g2"><div class="card"><h2>Distribuição das notas</h2>${dist}</div><div class="card"><h2>Link da pesquisa</h2><p style="margin:0;word-break:break-all">/pesquisa/${ID[k]}</p><p class="foot">Use este link no QR Code da unidade.</p></div></div>
<h2>Respostas</h2>${tbl(l)}`}

let tab="nao";
function pend(){const f={nao:i=>i.st=="nao",late,esc:i=>i.st=="esc"},T=[["nao","Não respondidas"],["late","Atrasadas"],["esc","Escalonadas"]];
return head("Pendências","O que precisa de ação agora. O prazo de resposta é de 48 horas.")+
`<div class="tabs">${T.map(([k,v])=>`<button class="btn o s${tab==k?"":""}" data-tab="${k}" ${tab==k?'style="background:var(--em);color:#fff"':""}>${v} (${D.filter(f[k]).length})</button>`).join("")}</div>${tbl(D.filter(f[tab]))}`}

function det(id){const i=D.find(x=>x.id==id);if(!i)return head("Manifestação não encontrada",'<a href="#manifestacoes">Voltar para a lista</a>');
return `<a class="back" href="#manifestacoes">← Voltar para a lista</a>
<div class="hd"><div><h1>Manifestação #${i.id}</h1><p class="sub"><a href="#pesquisa-${ID[i.u]}">Unidade ${U[i.u]}</a> · recebida há ${ago(i.h)}</p></div>${bd(i.st)}</div>
<div class="g3"><div class="stack"><div class="card"><div style="display:flex;align-items:center;gap:16px;margin-bottom:16px"><span class="nt big" style="background:${NC[i.n]};color:${i.n==3||i.n==4?"#171717":"#fff"}">${i.n}</span><div><h2 style="margin:0">${W[i.n]}</h2><span class="k">Senha de atendimento: ${i.s||"não informada"}</span></div></div>
<p style="margin:0">${esc(i.t||"O cliente não deixou comentário.")}</p></div>
${i.st=="conc"?'<div class="card">Manifestação concluída. O histórico não pode mais ser alterado.</div>':`<div class="card"><h2>Registrar tratativa</h2><textarea id="tx" placeholder="Descreva a tratativa ou a resposta enviada ao cliente" aria-label="Tratativa"></textarea>
<div class="acts"><button class="btn" data-act="resp">Registrar resposta</button><button class="btn f" data-act="esc">Escalonar</button><button class="btn o" data-act="conc">Concluir</button></div></div>`}</div>
<div class="card"><h2>Histórico</h2><ul class="tl">${i.hist.map(e=>`<li><b>${esc(e.w)}</b> ${esc(e.x)}<small>há ${ago(e.h)}</small></li>`).join("")}</ul><p class="foot" style="margin:0">O histórico é imutável: novas ações entram sempre no fim.</p></div></div>`}

function act(i,a){const t=$("#tx").value.trim();
if(a=="resp"&&!t){$("#tx").focus();return}
const m={resp:["resp","Resposta registrada: "+t],esc:["esc","Escalonada para a gerência."+(t?" Motivo: "+t:"")],conc:["conc","Manifestação concluída."+(t?" "+t:"")]}[a];
i.st=m[0];i.hist.push({h:0,w:"Você",x:m[1]});go();}

function go(){const h=location.hash.slice(1)||"dashboard",d=h.startsWith("manifestacao-"),p=h.startsWith("pesquisa-"),k=d?"manifestacoes":p?"pesquisas":h,m=$("#main");
const V={dashboard:dash,pesquisas:pesq,manifestacoes:manif,pendencias:pend};
const nome=(NAV.find(x=>x[0]==k)||[0,"Tela"])[1];
m.innerHTML=d?det(h.slice(13)):p?pdet(h.slice(9)):V[k]?V[k]():head(nome,"Tela prevista na arquitetura, ainda não prototipada.");
$("#nav").innerHTML=NAV.map(([id,l,p])=>`${id=="unidades"?'<span class="sp"></span>':""}<a href="#${id}" data-tip="${l}" class="${id==k?"on":""}" ${id==k?'aria-current="page"':""}>${ic(p)}<span class="lb">${l}</span>${id=="pendencias"&&D.filter(open).length?`<em>${D.filter(open).length}</em>`:""}</a>`).join("");
if(k=="manifestacoes"&&!d){["#q","#fs","#fu","#fn"].forEach(s=>$(s).addEventListener("input",fill));fill();}
if(!d)window.scrollTo(0,0);}
$("#main").addEventListener("click",e=>{
const b=e.target.closest("button");if(!b)return;
if(b.dataset.tab){tab=b.dataset.tab;go();}
if(b.dataset.act)act(D.find(x=>x.id==location.hash.slice(14)),b.dataset.act);
if(b.dataset.copy){const u=location.origin+"/pesquisa/"+ID[b.dataset.copy];try{navigator.clipboard.writeText(u)}catch(_){}const t=b.textContent;b.textContent="Copiado";setTimeout(()=>b.textContent=t,1500);}});
const tg=$("#tg"),ap=$(".app");
const sc=c=>{ap.classList.toggle("col",c);const t=c?"Expandir menu":"Recolher menu";tg.setAttribute("aria-expanded",String(!c));tg.setAttribute("aria-label",t);tg.dataset.tip=t;tg.querySelector(".lb").textContent=t;try{localStorage.setItem("menu",c?"1":"0")}catch(_){}};
tg.addEventListener("click",()=>sc(!ap.classList.contains("col")));
try{if(localStorage.getItem("menu")=="1")sc(true)}catch(_){}
addEventListener("hashchange",go);go();
</script>
</body>
</html>
