name: CI - Plataforma Cedro NIT (POO)

on:
  push:
    branches: [ prod ]
  pull_request:
    branches: [ prod ]

jobs:
  backend-qa:
    name: Back-end QA & Testes de Domínio POO
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Testes Unitários e de Integração (Vitest)
        run: npm test

      - name: Compilar TypeScript (tsc)
        run: npm run build

  frontend-build:
    name: Front-end Build & Typecheck (Next.js App Router)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependências
        run: npm ci

      - name: Compilar Front-end (Next.js Standalone Build)
        run: npm run build
